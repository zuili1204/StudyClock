# 本机 Gradle 缓存路径含中文，JDK 启动器按平台编码解析 @argfile；
# 默认写 UTF-8 会让测试进程找不到类，故 Gradle 进程固定 GBK，源码仍为 UTF-8。
# 换到 macOS / Linux / 英文 Windows 时，把 GBK 改成 UTF-8（见 README「从源码构建」）。
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=GBK -XX:+UseParallelGC
kotlin.compiler.execution.strategy=in-process
kapt.use.k2=false
kapt.use.worker.api=false
android.useAndroidX=true
android.nonTransitiveRClass=true
